<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Work together to solve the puzzle!">
    <title>Collaborative Puzzle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>🧩 Collaborative Puzzle</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Moves:</span>
                    <span id="moves" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Time:</span>
                    <span id="timer" class="stat-value">0:00</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <div class="game-message" id="gameMessage">
                <h2>Welcome!</h2>
                <p>Work together to solve the puzzle!</p>
                <p class="instruction">Tap pieces to swap them and complete the picture</p>
            </div>

            <!-- Puzzle Grid -->
            <div class="puzzle-container" id="puzzleContainer" style="display: none;">
                <div class="puzzle-grid" id="puzzleGrid">
                    <!-- Puzzle pieces will be added dynamically -->
                </div>
            </div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start Puzzle</button>
            <button id="restartBtn" class="btn btn-secondary" style="display: none;">New Puzzle</button>
            <button id="hintBtn" class="btn btn-hint" style="display: none;">Hint</button>
            <a href="../../index.html" class="btn btn-back">Back to Games</a>
        </footer>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>Puzzle Complete! 🎉</h2>
            <p class="final-score">Moves: <span id="finalMoves">0</span></p>
            <p class="final-time">Time: <span id="finalTime">0:00</span></p>
            <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
