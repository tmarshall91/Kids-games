<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Perform awesome stunts and jumps with your monster truck">
    <title>Monster Truck Jumps</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>🚚 Monster Truck Jumps</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Score:</span>
                    <span id="score" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Jumps:</span>
                    <span id="jumps" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Speed:</span>
                    <span id="speed" class="stat-value">0</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <!-- Ground -->
            <div class="ground" id="ground"></div>

            <!-- Monster Truck -->
            <div class="truck" id="truck">🚚</div>

            <!-- Obstacles/Ramps will be added dynamically -->

            <!-- Stunt Message -->
            <div class="stunt-message" id="stuntMessage"></div>

            <!-- Welcome Message -->
            <div class="game-message" id="gameMessage">
                <h2>Ready to Jump!</h2>
                <p>Tap to make your truck jump</p>
                <p>⭐ Jump over obstacles for points</p>
                <p>⭐ Perfect jumps earn bonus points!</p>
                <p>Avoid crashing into obstacles!</p>
            </div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start Game</button>
            <button id="jumpBtn" class="btn btn-jump" style="display: none;">JUMP! 🚀</button>
            <button id="restartBtn" class="btn btn-secondary" style="display: none;">Play Again</button>
        </footer>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>Crash! 💥</h2>
            <p class="final-score">Score: <span id="finalScore">0</span></p>
            <p class="final-stat">Total Jumps: <span id="finalJumps">0</span></p>
            <p class="final-stat">Best Stunt: <span id="bestStunt">Regular Jump</span></p>
            <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
