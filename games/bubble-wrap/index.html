<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Satisfying bubble wrap popping game for kids">
    <title>Bubble Wrap Pop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>Bubble Wrap Pop</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Popped:</span>
                    <span id="score" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Remaining:</span>
                    <span id="timer" class="stat-value">0</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <!-- Game content will be dynamically added here -->
            <div class="game-message" id="gameMessage">
                <h2>Ready to Pop?</h2>
                <p>Tap bubbles to pop them all!</p>
            </div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start Popping!</button>
            <button id="restartBtn" class="btn btn-secondary" style="display: none;">New Sheet</button>
        </footer>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>All Popped!</h2>
            <p class="final-score">You popped <span id="finalScore">0</span> bubbles!</p>
            <button id="playAgainBtn" class="btn btn-primary">Pop More!</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
