<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Repeat the musical sequences - memory game">
    <title>Music Memory - Kids Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>Music Memory</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Level:</span>
                    <span id="level" class="stat-value">1</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Best:</span>
                    <span id="best" class="stat-value">0</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <div class="music-pads">
                <div class="pad pad-red" data-note="0" data-color="red">
                    <div class="pad-note">Do</div>
                </div>
                <div class="pad pad-blue" data-note="1" data-color="blue">
                    <div class="pad-note">Re</div>
                </div>
                <div class="pad pad-green" data-note="2" data-color="green">
                    <div class="pad-note">Mi</div>
                </div>
                <div class="pad pad-yellow" data-note="3" data-color="yellow">
                    <div class="pad-note">Fa</div>
                </div>
            </div>

            <div class="game-message" id="gameMessage">
                <h2>Ready?</h2>
                <p>Watch and listen to the sequence</p>
                <p>Then repeat it by tapping the pads!</p>
            </div>

            <div class="status-message" id="statusMessage"></div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start Game</button>
            <button id="restartBtn" class="btn btn-secondary" style="display: none;">Try Again</button>
        </footer>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>Great Job!</h2>
            <p class="final-score">You reached level <span id="finalLevel">0</span>!</p>
            <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
