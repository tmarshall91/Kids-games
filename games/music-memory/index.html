<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Watch and listen to musical sequences, then repeat them!">
    <title>Music Memory - Kids Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>🎵 Music Memory</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Level:</span>
                    <span id="level" class="stat-value">1</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Score:</span>
                    <span id="score" class="stat-value">0</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <div class="game-message" id="gameMessage">
                <h2>Welcome to Music Memory!</h2>
                <p>Watch the sequence and repeat it</p>
                <p>Each level adds one more note!</p>
            </div>

            <div id="gameBoard" class="game-board" style="display: none;">
                <div class="color-buttons">
                    <div class="color-button" data-note="0" data-color="red"></div>
                    <div class="color-button" data-note="1" data-color="yellow"></div>
                    <div class="color-button" data-note="2" data-color="green"></div>
                    <div class="color-button" data-note="3" data-color="blue"></div>
                    <div class="color-button" data-note="4" data-color="purple"></div>
                    <div class="color-button" data-note="5" data-color="orange"></div>
                </div>
                <div class="status-message" id="statusMessage">Watch carefully...</div>
            </div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start Game</button>
            <button id="restartBtn" class="btn btn-secondary" style="display: none;">Play Again</button>
        </footer>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>Game Over!</h2>
            <p class="final-level">You reached Level: <span id="finalLevel">0</span></p>
            <p class="final-score">Score: <span id="finalScore">0</span></p>
            <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
