<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Letter tracing game for kids to learn writing">
    <title>Letter Tracing - Kids Learning</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>Letter Tracing</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Letter:</span>
                    <span id="currentLetter" class="stat-value">A</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Score:</span>
                    <span id="score" class="stat-value">0</span>
                </span>
            </div>
        </header>

        <main class="game-area" id="gameArea">
            <div class="game-message" id="gameMessage">
                <h2>Learn to Write!</h2>
                <p>Trace the letter with your finger</p>
            </div>
            <canvas id="tracingCanvas"></canvas>
        </main>

        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start</button>
            <button id="clearBtn" class="btn btn-secondary" style="display: none;">Clear</button>
            <button id="nextBtn" class="btn btn-success" style="display: none;">Next Letter</button>
        </footer>
    </div>

    <div id="celebrationOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>Great Job!</h2>
            <p class="celebration-message">You traced the letter perfectly!</p>
            <button id="continueBtn" class="btn btn-primary">Continue</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
