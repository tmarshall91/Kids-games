<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Control traffic lights to manage traffic flow and prevent crashes">
    <title>Traffic Controller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>🚦 Traffic Controller</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Score:</span>
                    <span id="score" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Cars:</span>
                    <span id="carsServed" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Crashes:</span>
                    <span id="crashes" class="stat-value">0</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <!-- Intersection -->
            <div class="intersection">
                <!-- Vertical Road -->
                <div class="road vertical"></div>
                <!-- Horizontal Road -->
                <div class="road horizontal"></div>

                <!-- Traffic Lights -->
                <div class="traffic-light north" id="lightNorth">
                    <div class="light red active"></div>
                    <div class="light green"></div>
                </div>
                <div class="traffic-light south" id="lightSouth">
                    <div class="light red active"></div>
                    <div class="light green"></div>
                </div>
                <div class="traffic-light east" id="lightEast">
                    <div class="light red active"></div>
                    <div class="light green"></div>
                </div>
                <div class="traffic-light west" id="lightWest">
                    <div class="light red active"></div>
                    <div class="light green"></div>
                </div>

                <!-- Cars will be added here dynamically -->
            </div>

            <!-- Welcome Message -->
            <div class="game-message" id="gameMessage">
                <h2>Control the Traffic!</h2>
                <p>Tap the traffic lights to change them from red to green</p>
                <p>Keep traffic flowing and avoid crashes!</p>
            </div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start Game</button>
            <button id="restartBtn" class="btn btn-secondary" style="display: none;">Restart</button>
        </footer>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>Game Over!</h2>
            <p class="final-score">Score: <span id="finalScore">0</span></p>
            <p class="final-stat">Cars Served: <span id="finalCars">0</span></p>
            <p class="final-stat">Crashes: <span id="finalCrashes">0</span></p>
            <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
