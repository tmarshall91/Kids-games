<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Test your reaction time with this fun traffic light game for kids">
    <title>Traffic Light Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>🚦 Traffic Light Game</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Score</span>
                    <span id="score" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Best Time</span>
                    <span id="bestTime" class="stat-value">-</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <!-- Instructions -->
            <div class="game-message" id="gameMessage">
                <h2>How to Play</h2>
                <p>🟢 <strong>GREEN</strong> = Tap Fast!</p>
                <p>🟡 <strong>YELLOW</strong> = Get Ready</p>
                <p>🔴 <strong>RED</strong> = Don't Tap!</p>
                <p style="margin-top: 15px; font-size: 16px;">Test your reaction time!</p>
            </div>

            <!-- Traffic Light -->
            <div class="traffic-light-container" id="trafficLight" style="display: none;">
                <div class="traffic-light">
                    <div class="light red" id="redLight"></div>
                    <div class="light yellow" id="yellowLight"></div>
                    <div class="light green" id="greenLight"></div>
                </div>
                <div class="instruction-text" id="instructionText">Get Ready!</div>
                <div class="reaction-time" id="reactionTime"></div>
            </div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start Game</button>
            <button id="restartBtn" class="btn btn-secondary" style="display: none;">New Round</button>
        </footer>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>Great Job! 🎉</h2>
            <p class="final-score">Final Score: <span id="finalScore">0</span></p>
            <p class="best-reaction">Best Reaction: <span id="bestReaction">-</span> ms</p>
            <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
