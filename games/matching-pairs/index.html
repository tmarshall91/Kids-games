<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speed Matching</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>⚡ Speed Matching ⚡</h1>
            <div class="game-stats">
                <span id="score" class="stat-badge">Score: 0</span>
                <span id="timer" class="stat-badge timer">Time: 60</span>
                <span id="combo" class="stat-badge combo" style="display: none;">Combo x1</span>
            </div>
        </header>

        <div id="menu-screen" class="screen">
            <h2>Match Pairs Fast!</h2>
            <p class="instructions">All cards are visible - find and tap matching pairs before time runs out!</p>

            <div class="difficulty-selector">
                <h3>Choose Difficulty:</h3>
                <div class="difficulty-buttons">
                    <button class="difficulty-btn" data-difficulty="easy">
                        <span class="diff-icon">🟢</span>
                        <span class="diff-name">Easy</span>
                        <span class="diff-desc">60 sec • 12 cards</span>
                    </button>
                    <button class="difficulty-btn" data-difficulty="medium">
                        <span class="diff-icon">🟡</span>
                        <span class="diff-name">Medium</span>
                        <span class="diff-desc">45 sec • 16 cards</span>
                    </button>
                    <button class="difficulty-btn" data-difficulty="hard">
                        <span class="diff-icon">🔴</span>
                        <span class="diff-name">Hard</span>
                        <span class="diff-desc">30 sec • 20 cards</span>
                    </button>
                </div>
            </div>

            <div class="theme-selector">
                <h3>Choose Theme:</h3>
                <div class="theme-buttons">
                    <button class="theme-btn" data-theme="animals">🐶 Animals</button>
                    <button class="theme-btn" data-theme="fruits">🍎 Fruits</button>
                    <button class="theme-btn" data-theme="emojis">😀 Emojis</button>
                    <button class="theme-btn" data-theme="sports">⚽ Sports</button>
                </div>
            </div>

            <button id="start-btn" class="btn btn-primary btn-large">START GAME</button>
            <a href="../../index.html" class="btn btn-secondary">Back to Games</a>
        </div>

        <main id="game-area" class="game-area" style="display: none;">
            <div id="game-board" class="board">
                <!-- Cards will be generated here -->
            </div>

            <div class="controls">
                <button id="pause-btn" class="btn btn-warning">⏸ Pause</button>
                <button id="quit-btn" class="btn btn-secondary">Quit</button>
            </div>
        </main>

        <div id="pause-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h2>⏸ Paused</h2>
                <p>Take a breath!</p>
                <button id="resume-btn" class="btn btn-primary">Resume</button>
                <button id="restart-btn" class="btn btn-secondary">Restart</button>
                <button id="menu-btn" class="btn btn-secondary">Main Menu</button>
            </div>
        </div>

        <div id="game-over-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h2 id="game-over-title">🎉 Amazing! 🎉</h2>
                <div id="final-stats" class="final-stats"></div>
                <button id="play-again-btn" class="btn btn-primary">Play Again</button>
                <button id="change-settings-btn" class="btn btn-secondary">Change Settings</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
