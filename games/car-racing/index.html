<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Top-down car racing game for kids">
    <title>Car Racing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>🏎️ Car Racing</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Score:</span>
                    <span id="score" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Speed:</span>
                    <span id="speed" class="stat-value">0</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <div class="road">
                <div class="road-marking" id="roadMarkings"></div>
                <div class="player-car" id="playerCar">🏎️</div>
            </div>
            <div class="game-message" id="gameMessage">
                <h2>Ready to Race!</h2>
                <p>Use arrow keys or swipe to move</p>
            </div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start Race</button>
            <button id="restartBtn" class="btn btn-secondary" style="display: none;">Race Again</button>
            <a href="../../index.html" class="btn btn-home">Home</a>
        </footer>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>Race Over!</h2>
            <p class="final-score">Score: <span id="finalScore">0</span></p>
            <p class="final-score">Distance: <span id="finalDistance">0</span>m</p>
            <button id="playAgainBtn" class="btn btn-primary">Race Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
