<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Navigate your airplane through the clouds">
    <title>Airplane Flying</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>✈️ Airplane Flying</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Score:</span>
                    <span id="score" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Altitude:</span>
                    <span id="altitude" class="stat-value">0</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <div class="sky" id="sky">
                <div class="airplane" id="airplane">✈️</div>
            </div>
            <div class="game-message" id="gameMessage">
                <h2>Ready for Takeoff!</h2>
                <p>Tap or click to fly up<br>Avoid the clouds!</p>
            </div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start Flight</button>
            <button id="restartBtn" class="btn btn-secondary" style="display: none;">Fly Again</button>
            <a href="../../index.html" class="btn btn-home">Home</a>
        </footer>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>Flight Ended!</h2>
            <p class="final-score">Score: <span id="finalScore">0</span></p>
            <p class="final-score">Clouds Passed: <span id="cloudsPassed">0</span></p>
            <button id="playAgainBtn" class="btn btn-primary">Fly Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
