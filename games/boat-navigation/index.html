<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Navigate your boat through water obstacles">
    <title>Boat Navigation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>⛵ Boat Navigation</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Score:</span>
                    <span id="score" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Distance:</span>
                    <span id="distance" class="stat-value">0</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <div class="water" id="water">
                <div class="boat" id="boat">⛵</div>
            </div>
            <div class="game-message" id="gameMessage">
                <h2>Ready to Sail!</h2>
                <p>Swipe or use arrow keys<br>Avoid obstacles!</p>
            </div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start Sailing</button>
            <button id="restartBtn" class="btn btn-secondary" style="display: none;">Sail Again</button>
            <a href="../../index.html" class="btn btn-home">Home</a>
        </footer>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>Journey Complete!</h2>
            <p class="final-score">Score: <span id="finalScore">0</span></p>
            <p class="final-score">Distance: <span id="finalDistance">0</span>m</p>
            <button id="playAgainBtn" class="btn btn-primary">Sail Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
