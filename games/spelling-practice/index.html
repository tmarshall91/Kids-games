<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Spell words by looking at emoji pictures!">
    <title>Spelling Practice - Kids Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>Spelling Practice</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Score:</span>
                    <span id="score" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Round:</span>
                    <span id="round" class="stat-value">1/10</span>
                </span>
            </div>
        </header>

        <main class="game-area" id="gameArea">
            <div class="picture-container">
                <div class="picture" id="picture">🐱</div>
                <p class="hint" id="hint">Spell this word!</p>
            </div>

            <div class="spelling-input">
                <div id="letterBoxes"></div>
            </div>

            <div class="keyboard" id="keyboard"></div>

            <div class="game-message" id="gameMessage">
                <h2>Ready to Spell?</h2>
                <p>Look at the picture and spell the word!</p>
                <p>Tap letters to build your answer</p>
            </div>
        </main>

        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start Game</button>
            <button id="checkBtn" class="btn btn-check" style="display: none;">Check Answer</button>
            <button id="clearBtn" class="btn btn-secondary" style="display: none;">Clear</button>
            <button id="nextBtn" class="btn btn-primary" style="display: none;">Next Word</button>
        </footer>
    </div>

    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>Great Job!</h2>
            <p class="final-score">Final Score: <span id="finalScore">0</span>/10</p>
            <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
