<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Slice falling fruits - A fun fruit slicing game for kids">
    <title>Fruit Slicer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>🍎 Fruit Slicer</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Score:</span>
                    <span id="score" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Time:</span>
                    <span id="timer" class="stat-value">30</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <div class="game-info" id="gameInfo">
                <h2>Tap fruits to slice them!</h2>
                <p>Get as many as you can in 30 seconds</p>
                <button id="startBtn" class="btn btn-primary">Start Game</button>
            </div>
            <div class="fruits-container" id="fruitsContainer"></div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <button id="restartBtn" class="btn btn-secondary" style="display: none;">Play Again</button>
        </footer>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>Time's Up! 🍇</h2>
            <p class="message">You sliced <span id="finalScore">0</span> fruits!</p>
            <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
