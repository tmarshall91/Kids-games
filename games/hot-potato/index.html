<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Pass the hot potato before the timer runs out!">
    <title>Hot Potato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>🔥🥔 Hot Potato 🥔🔥</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Round:</span>
                    <span id="round" class="stat-value">1</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Time:</span>
                    <span id="timer" class="stat-value">5</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <div class="game-message" id="gameMessage">
                <h2>Welcome!</h2>
                <p>Pass the hot potato to other players!</p>
                <p class="instruction">Tap the potato to pass it before time runs out!</p>
            </div>

            <!-- Player Grid -->
            <div class="players-grid" id="playersGrid" style="display: none;">
                <!-- Players will be added dynamically -->
            </div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start Game</button>
            <button id="restartBtn" class="btn btn-secondary" style="display: none;">New Round</button>
            <a href="../../index.html" class="btn btn-back">Back to Games</a>
        </footer>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2 id="overlayTitle">Round Over!</h2>
            <p class="final-score">Player <span id="loserPlayer">1</span> got caught!</p>
            <p class="rounds-info">Rounds Completed: <span id="finalRound">0</span></p>
            <button id="playAgainBtn" class="btn btn-primary">Next Round</button>
            <button id="quitBtn" class="btn btn-secondary">Quit</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
