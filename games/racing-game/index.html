<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Fun racing game for kids">
    <title>Racing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>🏎️ Racing Game</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Score:</span>
                    <span id="score" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Speed:</span>
                    <span id="speed" class="stat-value">0</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <div class="game-message" id="gameMessage">
                <h2>🏁 Ready to Race?</h2>
                <p>Tap left or right to steer your car!</p>
                <p>Avoid obstacles and collect coins!</p>
            </div>

            <div class="race-track" id="raceTrack" style="display: none;">
                <div class="road">
                    <div class="lane-line"></div>
                    <div class="lane-line"></div>
                </div>
                <div class="player-car" id="playerCar">🏎️</div>
                <div class="obstacles-container" id="obstaclesContainer"></div>
            </div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start Race</button>
            <button id="leftBtn" class="btn btn-control" style="display: none;">⬅️</button>
            <button id="rightBtn" class="btn btn-control" style="display: none;">➡️</button>
            <a href="../../index.html" class="btn btn-back">← Back</a>
        </footer>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>🏁 Race Finished!</h2>
            <p class="final-score">Score: <span id="finalScore">0</span></p>
            <p class="stats-detail">
                <span id="coinsCollected">0</span> coins collected<br>
                <span id="obstaclesAvoided">0</span> obstacles avoided
            </p>
            <button id="playAgainBtn" class="btn btn-primary">Race Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
