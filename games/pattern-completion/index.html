<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Pattern Completion - Identify the next item in the sequence">
    <title>Pattern Completion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>🔢 Pattern Completion</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Score:</span>
                    <span id="score" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Level:</span>
                    <span id="level" class="stat-value">1</span>
                </span>
            </div>
        </header>

        <!-- Instructions -->
        <div id="instructions" class="instructions">
            <h2>How to Play</h2>
            <p>Look at the pattern and choose what comes next!</p>
            <button id="startBtn" class="btn btn-primary">Start Game</button>
        </div>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea" style="display: none;">
            <div class="question-text">What comes next?</div>

            <div id="patternDisplay" class="pattern-display"></div>

            <div class="question-mark">❓</div>

            <div id="choicesContainer" class="choices-container"></div>

            <div id="feedback" class="feedback"></div>
        </main>

        <!-- Game Complete Message -->
        <div class="game-message" id="gameComplete" style="display: none;">
            <h2>🎉 Amazing Work!</h2>
            <p>You completed all the patterns!</p>
            <p class="stats">Final Score: <span id="finalScore">0</span></p>
            <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
        </div>

        <!-- Controls Section -->
        <footer class="game-controls" id="controls" style="display: none;">
            <button id="skipBtn" class="btn btn-secondary">Skip Pattern</button>
        </footer>
    </div>

    <script src="game.js"></script>
</body>
</html>
