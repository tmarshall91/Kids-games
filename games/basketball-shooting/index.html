<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Basketball Shooting - Shoot hoops and score points!">
    <title>Basketball Shooting</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>🏀 Basketball Shooting</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Score:</span>
                    <span id="score" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Time:</span>
                    <span id="timer" class="stat-value">30</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <!-- Game content will be dynamically added here -->
            <div class="game-message" id="gameMessage">
                <h2>Ready to Shoot Some Hoops?</h2>
                <p>Tap and drag to aim, release to shoot!</p>
                <p>Score as many baskets as you can in 30 seconds!</p>
            </div>

            <!-- Basketball hoop -->
            <div class="hoop" id="hoop">
                <div class="backboard"></div>
                <div class="rim"></div>
                <div class="net"></div>
            </div>

            <!-- Basketball -->
            <div class="basketball" id="basketball">🏀</div>

            <!-- Power meter -->
            <div class="power-meter-container" id="powerMeterContainer" style="display: none;">
                <div class="power-meter-label">Power</div>
                <div class="power-meter-bar">
                    <div class="power-meter-fill" id="powerMeterFill"></div>
                </div>
            </div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start Game</button>
            <button id="restartBtn" class="btn btn-secondary" style="display: none;">Play Again</button>
        </footer>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>Game Over!</h2>
            <p class="final-score">Score: <span id="finalScore">0</span></p>
            <p class="final-message" id="finalMessage">Great shooting!</p>
            <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
