<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Baseball Batting - Hit home runs with perfect timing!">
    <title>Baseball Batting</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>⚾ Baseball Batting</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Score:</span>
                    <span id="score" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Hits:</span>
                    <span id="hits" class="stat-value">0</span>
                </span>
            </div>
        </header>

        <main class="game-area" id="gameArea">
            <div class="game-message" id="gameMessage">
                <h2>Ready to Bat?</h2>
                <p>Tap when the ball reaches the strike zone!</p>
                <p>Perfect timing = Home Run!</p>
            </div>

            <div class="field">
                <div class="pitcher" id="pitcher">🧢</div>
                <div class="baseball" id="baseball">⚾</div>
                <div class="strike-zone" id="strikeZone"></div>
                <div class="batter" id="batter">🏏</div>

                <div class="timing-bar-container" id="timingBarContainer" style="display: none;">
                    <div class="timing-bar">
                        <div class="timing-indicator" id="timingIndicator"></div>
                        <div class="timing-perfect"></div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start Game</button>
            <button id="swingBtn" class="btn btn-swing" style="display: none;">SWING!</button>
            <button id="restartBtn" class="btn btn-secondary" style="display: none;">Play Again</button>
        </footer>
    </div>

    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>Game Over!</h2>
            <p class="final-score">Score: <span id="finalScore">0</span></p>
            <p class="final-hits">Hits: <span id="finalHits">0</span> / 10</p>
            <p class="final-message" id="finalMessage">Great batting!</p>
            <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
