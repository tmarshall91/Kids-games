<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Jigsaw Puzzles - Arrange pieces to complete the picture">
    <title>Jigsaw Puzzle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>🧩 Jigsaw Puzzle</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Placed:</span>
                    <span id="placed" class="stat-value">0/<span id="total">4</span></span>
                </span>
                <span class="stat">
                    <span class="stat-label">Time:</span>
                    <span id="timer" class="stat-value">0:00</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <div class="difficulty-selector" id="difficultySelector">
                <h2>Choose Difficulty</h2>
                <button class="difficulty-btn" data-pieces="4">Easy (2×2)</button>
                <button class="difficulty-btn" data-pieces="9">Medium (3×3)</button>
                <button class="difficulty-btn" data-pieces="16">Hard (4×4)</button>
            </div>

            <div id="puzzleArea" class="puzzle-area" style="display: none;">
                <div id="puzzleBoard" class="puzzle-board"></div>
                <div id="piecesContainer" class="pieces-container"></div>
            </div>

            <div class="game-message" id="gameMessage" style="display: none;">
                <h2>🎉 Puzzle Complete!</h2>
                <p>You finished the puzzle!</p>
                <p class="stats">Time: <span id="finalTime">0:00</span></p>
            </div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <button id="shuffleBtn" class="btn btn-secondary" style="display: none;">Shuffle Pieces</button>
            <button id="newGameBtn" class="btn btn-primary" style="display: none;">New Game</button>
        </footer>
    </div>

    <script src="game.js"></script>
</body>
</html>
