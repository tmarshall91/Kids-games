<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Snap photos of wild animals on your safari adventure">
    <title>Wildlife Safari Photo Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>📸 Safari Photos 📸</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Photos:</span>
                    <span id="score" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Time:</span>
                    <span id="timer" class="stat-value">30</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <!-- Game message -->
            <div class="game-message" id="gameMessage">
                <h2>Welcome Safari Explorer!</h2>
                <p>Tap the animals quickly to photograph them</p>
                <p class="instructions">Catch as many as you can in 30 seconds!</p>
            </div>

            <!-- Safari scene -->
            <div id="safariScene" class="safari-scene" style="display: none;"></div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start Safari</button>
            <button id="restartBtn" class="btn btn-secondary" style="display: none;">New Safari</button>
        </footer>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>📷 Safari Complete! 📷</h2>
            <p class="final-score">Photos Taken: <span id="finalScore">0</span></p>
            <p class="animals-list">Animals photographed: <span id="animalsList"></span></p>
            <button id="playAgainBtn" class="btn btn-primary">New Safari</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
