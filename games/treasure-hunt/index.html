<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Follow the clues to find the hidden treasure! A fun adventure game for kids.">
    <title>Treasure Hunt - Find the Hidden Treasure!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>Treasure Hunt</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Clues Found:</span>
                    <span id="cluesFound" class="stat-value">0/7</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Time:</span>
                    <span id="timer" class="stat-value">0:00</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <!-- Welcome Message -->
            <div class="game-message" id="gameMessage">
                <h2>Welcome Treasure Hunter!</h2>
                <p>Follow the clues to find the hidden treasure!</p>
                <p class="instruction">Tap each location as you solve the riddles</p>
            </div>

            <!-- Treasure Map -->
            <div class="treasure-map" id="treasureMap" style="display: none;">
                <!-- Map locations will be added dynamically -->
            </div>

            <!-- Clue Display -->
            <div class="clue-display" id="clueDisplay" style="display: none;">
                <div class="clue-header">
                    <h3>Current Clue:</h3>
                    <button id="hintBtn" class="hint-btn">Need a Hint?</button>
                </div>
                <p class="clue-text" id="clueText"></p>
                <p class="hint-text" id="hintText" style="display: none;"></p>
            </div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start Adventure</button>
            <button id="restartBtn" class="btn btn-secondary" style="display: none;">New Adventure</button>
        </footer>
    </div>

    <!-- Success Overlay -->
    <div id="successOverlay" class="overlay" style="display: none;">
        <div class="overlay-content success-content">
            <div class="treasure-emoji">💰</div>
            <h2>Treasure Found!</h2>
            <p class="congratulations">Congratulations, Treasure Hunter!</p>
            <p class="final-stats">
                <span class="stat-item">Clues Found: <strong>7/7</strong></span>
                <span class="stat-item">Time: <strong id="finalTime">0:00</strong></span>
                <span class="stat-item">Hints Used: <strong id="hintsUsed">0</strong></span>
            </p>
            <button id="playAgainBtn" class="btn btn-primary">Hunt Again!</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
