<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Create graffiti art with spray paint!">
    <title>Spray Paint Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>🎨 Spray Paint</h1>
        </header>

        <main class="game-area">
            <canvas id="sprayCanvas"></canvas>
        </main>

        <footer class="game-controls">
            <div class="control-row">
                <label>Color:</label>
                <div class="color-grid">
                    <button class="color-btn active" data-color="#FF0000" style="background: #FF0000;"></button>
                    <button class="color-btn" data-color="#00FF00" style="background: #00FF00;"></button>
                    <button class="color-btn" data-color="#0099FF" style="background: #0099FF;"></button>
                    <button class="color-btn" data-color="#FFD700" style="background: #FFD700;"></button>
                    <button class="color-btn" data-color="#FF1493" style="background: #FF1493;"></button>
                    <button class="color-btn" data-color="#FFFFFF" style="background: #FFF; border: 2px solid #999;"></button>
                </div>
            </div>
            <div class="control-row">
                <label>Spray Size:</label>
                <div class="size-buttons">
                    <button class="size-btn" data-size="20">Small</button>
                    <button class="size-btn active" data-size="40">Medium</button>
                    <button class="size-btn" data-size="60">Large</button>
                </div>
            </div>
            <div class="control-row">
                <button id="clearBtn" class="btn-action">🗑️ Clear Wall</button>
            </div>
        </footer>
    </div>

    <script src="game.js"></script>
</body>
</html>
