<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Build words from letters! A fun word-building game for kids.">
    <title>Word Building - Kids Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>Word Building</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Score:</span>
                    <span id="score" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Words:</span>
                    <span id="wordsFound" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Set:</span>
                    <span id="currentSet" class="stat-value">1/5</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <!-- Available Letters Section -->
            <div class="letters-section">
                <h2 class="section-title">Your Letters:</h2>
                <div class="available-letters" id="availableLetters"></div>
            </div>

            <!-- Word Building Area -->
            <div class="building-section">
                <h3 class="section-subtitle">Build a Word:</h3>
                <div class="word-builder" id="wordBuilder"></div>
                <div class="word-length-hint" id="wordLengthHint">Minimum 3 letters</div>
            </div>

            <!-- Words Found List -->
            <div class="words-found-section">
                <h3 class="section-subtitle">Words Found:</h3>
                <div class="words-list" id="wordsList">
                    <div class="no-words">No words found yet!</div>
                </div>
            </div>

            <!-- Welcome Message -->
            <div class="game-message" id="gameMessage">
                <h2>Ready to Build Words?</h2>
                <p>Tap letters to make words!</p>
                <p>3+ letters each</p>
                <p>Find as many as you can!</p>
            </div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start Game</button>
            <button id="submitBtn" class="btn btn-check" style="display: none;">Submit Word</button>
            <button id="clearBtn" class="btn btn-secondary" style="display: none;">Clear</button>
            <button id="nextSetBtn" class="btn btn-next" style="display: none;">Next Set</button>
        </footer>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>Awesome Job!</h2>
            <p class="final-score">Total Score: <span id="finalScore">0</span></p>
            <p class="final-words">Words Found: <span id="finalWordsCount">0</span></p>
            <p class="performance-message" id="performanceMessage"></p>
            <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
