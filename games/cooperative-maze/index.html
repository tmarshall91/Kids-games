<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Navigate the maze together!">
    <title>Cooperative Maze</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>🔷 Cooperative Maze</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Moves:</span>
                    <span id="moves" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Time:</span>
                    <span id="timer" class="stat-value">0:00</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <div class="game-message" id="gameMessage">
                <h2>Welcome!</h2>
                <p>Help players reach the goal together!</p>
                <p class="instruction">Use arrow buttons or swipe to move</p>
            </div>

            <!-- Maze Container -->
            <div class="maze-container" id="mazeContainer" style="display: none;">
                <div class="maze-grid" id="mazeGrid">
                    <!-- Maze will be generated here -->
                </div>
            </div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <div class="direction-pad" id="directionPad" style="display: none;">
                <button class="dir-btn" id="upBtn">⬆️</button>
                <div class="dir-row">
                    <button class="dir-btn" id="leftBtn">⬅️</button>
                    <button class="dir-btn" id="rightBtn">➡️</button>
                </div>
                <button class="dir-btn" id="downBtn">⬇️</button>
            </div>
            <div class="main-controls">
                <button id="startBtn" class="btn btn-primary">Start Maze</button>
                <button id="restartBtn" class="btn btn-secondary" style="display: none;">New Maze</button>
                <a href="../../index.html" class="btn btn-back">Back to Games</a>
            </div>
        </footer>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>Maze Complete! 🎉</h2>
            <p class="final-score">Moves: <span id="finalMoves">0</span></p>
            <p class="final-time">Time: <span id="finalTime">0:00</span></p>
            <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
