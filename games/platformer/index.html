<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Jump and run through exciting platformer levels!">
    <title>Platformer Adventure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>Platformer Adventure</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Level:</span>
                    <span id="level" class="stat-value">1</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Score:</span>
                    <span id="score" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Lives:</span>
                    <span id="lives" class="stat-value">3</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <!-- Canvas for game rendering -->
            <canvas id="gameCanvas"></canvas>

            <!-- Game message overlay -->
            <div class="game-message" id="gameMessage">
                <h2>Platformer Adventure</h2>
                <p>Use arrow keys or on-screen buttons to move</p>
                <p>Press SPACE or Jump button to jump</p>
                <p>Collect stars and reach the flag!</p>
            </div>
        </main>

        <!-- Mobile Controls -->
        <div class="mobile-controls" id="mobileControls">
            <div class="control-group">
                <button id="leftBtn" class="control-btn direction-btn">◀</button>
                <button id="rightBtn" class="control-btn direction-btn">▶</button>
            </div>
            <div class="control-group">
                <button id="jumpBtn" class="control-btn jump-btn">JUMP</button>
            </div>
        </div>

        <!-- Controls Section -->
        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start Game</button>
            <button id="restartBtn" class="btn btn-secondary" style="display: none;">Restart</button>
            <a href="../../index.html" class="btn btn-back">Back to Games</a>
        </footer>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>Game Over!</h2>
            <p class="final-score">Final Score: <span id="finalScore">0</span></p>
            <p class="final-level">Level Reached: <span id="finalLevel">1</span></p>
            <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <!-- Level Complete Overlay -->
    <div id="levelCompleteOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>Level Complete!</h2>
            <p class="level-score">Score: <span id="levelScore">0</span></p>
            <button id="nextLevelBtn" class="btn btn-primary">Next Level</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
