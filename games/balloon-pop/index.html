<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Pop colorful balloons before they float away! A fun mobile-friendly game for kids.">
    <title>Balloon Pop - Kids Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>🎈 Balloon Pop 🎈</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Score:</span>
                    <span id="score" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Time:</span>
                    <span id="timer" class="stat-value">30</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <!-- Balloons will be dynamically added here -->
            <div class="game-message" id="gameMessage">
                <h2>Ready to Pop Some Balloons?</h2>
                <p>Tap the balloons before they float away!</p>
                <p class="hint">Bigger balloons = More points!</p>
            </div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start Game</button>
            <button id="restartBtn" class="btn btn-secondary" style="display: none;">Restart</button>
            <a href="../../index.html" class="btn btn-back">Back to Games</a>
        </footer>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>Great Job! 🎉</h2>
            <p class="final-score">You popped <span id="finalScore">0</span> balloons!</p>
            <p class="encouraging-message" id="encouragingMessage"></p>
            <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
            <a href="../../index.html" class="btn btn-secondary">Back to Games</a>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
