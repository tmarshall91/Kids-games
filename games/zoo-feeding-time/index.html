<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Feed the zoo animals their favorite foods">
    <title>Zoo Feeding Time</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>🦁 Zoo Feeding 🐘</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Score:</span>
                    <span id="score" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Level:</span>
                    <span id="level" class="stat-value">1</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <!-- Game message -->
            <div class="game-message" id="gameMessage">
                <h2>Welcome to the Zoo!</h2>
                <p>Feed each animal its favorite food</p>
                <p class="instructions">Tap the correct food for each animal</p>
            </div>

            <!-- Game scene -->
            <div id="gameScene" class="game-scene" style="display: none;">
                <!-- Current animal -->
                <div class="animal-display">
                    <div class="animal-emoji" id="currentAnimal">🦁</div>
                    <p class="animal-request" id="animalRequest">I'm hungry!</p>
                </div>

                <!-- Food options -->
                <div class="food-options" id="foodOptions"></div>

                <!-- Feedback message -->
                <div class="feedback" id="feedback"></div>
            </div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start Feeding</button>
            <button id="restartBtn" class="btn btn-secondary" style="display: none;">Restart</button>
        </footer>
    </div>

    <!-- Level Complete Overlay -->
    <div id="levelCompleteOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>🎉 Level Complete! 🎉</h2>
            <p class="level-score">Score: <span id="levelScore">0</span></p>
            <button id="nextLevelBtn" class="btn btn-primary">Next Level</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
