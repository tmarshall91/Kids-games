<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Match the dance moves as they scroll by!">
    <title>Dance Move Matcher - Kids Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>Dance Move Matcher</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Score:</span>
                    <span id="score" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Combo:</span>
                    <span id="combo" class="stat-value">0</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <!-- Target Zone -->
            <div class="target-zone">
                <div class="target-arrow" data-direction="left">
                    <div class="arrow">←</div>
                </div>
                <div class="target-arrow" data-direction="up">
                    <div class="arrow">↑</div>
                </div>
                <div class="target-arrow" data-direction="down">
                    <div class="arrow">↓</div>
                </div>
                <div class="target-arrow" data-direction="right">
                    <div class="arrow">→</div>
                </div>
            </div>

            <!-- Dance Lanes -->
            <div class="dance-lanes">
                <div class="lane" data-lane="0"></div>
                <div class="lane" data-lane="1"></div>
                <div class="lane" data-lane="2"></div>
                <div class="lane" data-lane="3"></div>
            </div>

            <div class="game-message" id="gameMessage">
                <h2>Get Ready to Dance!</h2>
                <p>Tap the matching arrow when it reaches the target</p>
                <p>Build combos for higher scores!</p>
            </div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start Dancing</button>
        </footer>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>Great Dancing!</h2>
            <p class="final-score">Score: <span id="finalScore">0</span></p>
            <p class="max-combo">Max Combo: <span id="maxCombo">0</span></p>
            <button id="playAgainBtn" class="btn btn-primary">Dance Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
