<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Match pairs of sounds in this memory game!">
    <title>Sound Matching - Kids Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>Sound Matching</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Pairs:</span>
                    <span id="pairs" class="stat-value">0/8</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Tries:</span>
                    <span id="tries" class="stat-value">0</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <div class="cards-grid" id="cardsGrid">
                <!-- Cards will be generated by JavaScript -->
            </div>

            <div class="game-message" id="gameMessage">
                <h2>Match the Sounds!</h2>
                <p>Tap cards to hear sounds</p>
                <p>Find matching pairs!</p>
            </div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start Game</button>
            <button id="restartBtn" class="btn btn-secondary" style="display: none;">New Game</button>
        </footer>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>You Win!</h2>
            <p class="final-score">Completed in <span id="finalTries">0</span> tries!</p>
            <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
