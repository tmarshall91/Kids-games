<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Match similar sounds! Listen carefully and find the matching pairs.">
    <title>Sound Matching Game - Kids Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>🔊 Sound Matching</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Score:</span>
                    <span id="score" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Matches:</span>
                    <span id="matches" class="stat-value">0/6</span>
                </span>
            </div>
        </header>

        <main class="game-area" id="gameArea">
            <div class="game-message" id="gameMessage">
                <h2>Sound Matching Game!</h2>
                <p>Tap cards to hear sounds</p>
                <p>Find the matching pairs!</p>
            </div>

            <div id="gameBoard" class="game-board" style="display: none;">
                <div class="sound-cards" id="soundCards"></div>
            </div>
        </main>

        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start Game</button>
            <button id="restartBtn" class="btn btn-secondary" style="display: none;">Play Again</button>
        </footer>
    </div>

    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>All Matched! 🎉</h2>
            <p class="final-score">Score: <span id="finalScore">0</span></p>
            <p class="completion-time">Time: <span id="finalTime">0</span>s</p>
            <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
