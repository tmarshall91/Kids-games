<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Create your own beats and music loops!">
    <title>Beat Making - Kids Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>Beat Making</h1>
            <div class="game-controls-top">
                <button id="playBtn" class="control-btn">▶ Play</button>
                <button id="stopBtn" class="control-btn">■ Stop</button>
                <button id="clearBtn" class="control-btn">Clear</button>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <div class="beat-grid-container">
                <div class="instrument-labels">
                    <div class="label">Kick</div>
                    <div class="label">Snare</div>
                    <div class="label">Hi-Hat</div>
                    <div class="label">Clap</div>
                </div>

                <div class="beat-grid" id="beatGrid">
                    <!-- Grid will be generated by JavaScript -->
                </div>

                <div class="beat-position" id="beatPosition"></div>
            </div>

            <div class="instructions">
                <p>Tap cells to add sounds to your beat!</p>
                <p>Press Play to hear your creation!</p>
            </div>
        </main>

        <!-- Controls Section -->
        <footer class="game-footer">
            <div class="tempo-control">
                <label>Tempo: <span id="tempoValue">120</span> BPM</label>
                <input type="range" id="tempoSlider" min="60" max="180" value="120" step="10">
            </div>
        </footer>
    </div>

    <script src="game.js"></script>
</body>
</html>
