<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Pass-and-play mini challenges!">
    <title>Relay Race</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>🏃 Relay Race</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Round:</span>
                    <span id="round" class="stat-value">1</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Score:</span>
                    <span id="score" class="stat-value">0</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <div class="game-message" id="gameMessage">
                <h2>Welcome!</h2>
                <p>Complete challenges as a team!</p>
                <p class="instruction">Pass the device and take turns completing challenges</p>
            </div>

            <!-- Challenge Area -->
            <div class="challenge-container" id="challengeContainer" style="display: none;">
                <div class="player-indicator" id="playerIndicator">
                    <h2>Player <span id="currentPlayer">1</span>'s Turn!</h2>
                </div>

                <div class="challenge-card" id="challengeCard">
                    <div class="challenge-icon" id="challengeIcon">🎯</div>
                    <h3 id="challengeTitle">Challenge Title</h3>
                    <p id="challengeDescription">Challenge description goes here</p>

                    <div class="challenge-game" id="challengeGame">
                        <!-- Challenge-specific content will be added here -->
                    </div>

                    <div class="challenge-timer" id="challengeTimer">
                        <div class="timer-label">Time:</div>
                        <div class="timer-value" id="timerValue">10</div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <div class="challenge-controls" id="challengeControls" style="display: none;">
                <button id="readyBtn" class="btn btn-primary">I'm Ready!</button>
                <button id="passBtn" class="btn btn-secondary" style="display: none;">Pass Turn</button>
            </div>
            <div class="main-controls">
                <button id="startBtn" class="btn btn-primary">Start Race</button>
                <button id="restartBtn" class="btn btn-secondary" style="display: none;">New Race</button>
                <a href="../../index.html" class="btn btn-back">Back to Games</a>
            </div>
        </footer>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>Race Complete! 🎉</h2>
            <p class="final-score">Team Score: <span id="finalScore">0</span></p>
            <p class="rounds-completed">Rounds: <span id="finalRound">0</span></p>
            <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
