<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Pilot a helicopter to rescue people and complete missions">
    <title>Helicopter Rescue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>🚁 Helicopter Rescue</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Rescued:</span>
                    <span id="rescued" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Fuel:</span>
                    <span id="fuel" class="stat-value">100</span>
                    <span class="stat-label">%</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Score:</span>
                    <span id="score" class="stat-value">0</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <!-- Sky Background -->
            <div class="sky-background">
                <div class="cloud" style="left: 10%; top: 20%; animation-delay: 0s;"></div>
                <div class="cloud" style="left: 60%; top: 40%; animation-delay: 2s;"></div>
                <div class="cloud" style="left: 30%; top: 60%; animation-delay: 4s;"></div>
            </div>

            <!-- Helicopter -->
            <div class="helicopter" id="helicopter">🚁</div>

            <!-- Rescue Hook -->
            <div class="rescue-hook" id="rescueHook" style="display: none;"></div>

            <!-- Ground -->
            <div class="ground" id="ground">
                <!-- People/objects to rescue will be added here -->
            </div>

            <!-- Rescue Message -->
            <div class="rescue-message" id="rescueMessage"></div>

            <!-- Welcome Message -->
            <div class="game-message" id="gameMessage">
                <h2>Rescue Mission!</h2>
                <p>🚁 Pilot your helicopter</p>
                <p>⬇️ Lower the hook to rescue people</p>
                <p>⬆️ Lift them to safety</p>
                <p>⛽ Watch your fuel!</p>
            </div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <div class="control-pad" id="controlPad" style="display: none;">
                <button class="arrow-btn left" id="leftBtn">◄</button>
                <button class="arrow-btn right" id="rightBtn">►</button>
                <button class="action-btn" id="hookBtn">🪝 Hook</button>
            </div>
            <button id="startBtn" class="btn btn-primary">Start Mission</button>
            <button id="restartBtn" class="btn btn-secondary" style="display: none;">New Mission</button>
        </footer>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2 id="gameOverTitle">Mission Complete! 🎉</h2>
            <p class="final-score">People Rescued: <span id="finalRescued">0</span></p>
            <p class="final-stat">Score: <span id="finalScore">0</span></p>
            <p id="missionRank" class="mission-rank"></p>
            <button id="playAgainBtn" class="btn btn-primary">New Mission</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
