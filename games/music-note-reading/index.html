<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Learn to read music notes on the staff!">
    <title>Music Note Reading - Kids Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <h1>Music Note Reading</h1>
            <div class="game-stats">
                <span class="stat">
                    <span class="stat-label">Score:</span>
                    <span id="score" class="stat-value">0</span>
                </span>
                <span class="stat">
                    <span class="stat-label">Streak:</span>
                    <span id="streak" class="stat-value">0</span>
                </span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-area" id="gameArea">
            <!-- Musical Staff -->
            <div class="staff-container">
                <div class="staff">
                    <div class="staff-line"></div>
                    <div class="staff-line"></div>
                    <div class="staff-line"></div>
                    <div class="staff-line"></div>
                    <div class="staff-line"></div>
                    <div class="note" id="musicalNote">♪</div>
                </div>
            </div>

            <!-- Note Buttons -->
            <div class="note-buttons">
                <button class="note-btn" data-note="C">C</button>
                <button class="note-btn" data-note="D">D</button>
                <button class="note-btn" data-note="E">E</button>
                <button class="note-btn" data-note="F">F</button>
                <button class="note-btn" data-note="G">G</button>
                <button class="note-btn" data-note="A">A</button>
                <button class="note-btn" data-note="B">B</button>
            </div>

            <!-- Feedback Message -->
            <div class="feedback-message" id="feedbackMessage"></div>

            <div class="game-message" id="gameMessage">
                <h2>Learn Musical Notes!</h2>
                <p>Identify the note on the staff</p>
                <p>Tap the correct letter below</p>
            </div>
        </main>

        <!-- Controls Section -->
        <footer class="game-controls">
            <button id="startBtn" class="btn btn-primary">Start Learning</button>
        </footer>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay" style="display: none;">
        <div class="overlay-content">
            <h2>Great Job!</h2>
            <p class="final-score">Score: <span id="finalScore">0</span></p>
            <p class="max-streak">Best Streak: <span id="maxStreak">0</span></p>
            <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
